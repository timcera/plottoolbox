[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools-scm[simple]>=8",
    "setuptools>=80"
]

[project]
authors = [
    {email = "tim@cerazone.net", name = "Tim Cera"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
] # Get strings from http://pypi.python.org/pypi?%3Aaction=list_classifiers
dependencies = [
    "cltoolbox >= 1.0.0",
    "dateparser",
    "matplotlib",
    "numpy",
    "pandas[excel]",
    "pint",
    "pint-pandas",
    "pydantic",
    "scipy",
    "tabulate",
    "xlsxwriter"
]
description = "Command line script and Python library to make plots from data files."
dynamic = ["readme", "version"]
keywords = [
    "aggregate",
    "cli-app",
    "fill",
    "filter",
    "time-series"
]
license = {text = "BSD-3-Clause"}
name = "plottoolbox"
requires-python = ">=3.10"

[project.scripts]
plottoolbox = "plottoolbox.plottoolbox:_main"

[project.urls]
bitbucket = "https://bitbucket.org/timcera/plottoolbox/src/main/"
documentation = "https://timcera.bitbucket.io/plottoolbox/docs/index.html#plottoolbox-documentation"
github = "https://github.com/timcera/plottoolbox"

[tool]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version = "105.2.4"
version_files = ["VERSION"]
multiline = true

[tool.isort]
profile = "black"

[tool.jupytext]
formats = "auto:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true
exclude = [
    "src/*/SciencePlots/**/*.py",
    "src/*/SkillMetrics/**/*.py",
    "src/*/toolbox_utils/**/*.py",
    "src/*/waterfall_ax/**/*.py"
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort.import-heading]
future = "Future imports"
standard-library = "Standard library imports"
third-party = "Third party imports"
first-party = "First party imports"
local-folder = "Local folder imports"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt"]

[tool.setuptools.dynamic]
readme = {file = "README.rst"}
version = {file = "VERSION"}

[tool.setuptools.package-data]
"plottoolbox.SciencePlots.scienceplots.styles" = ["**/*.mplstyle"]

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]
